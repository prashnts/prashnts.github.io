      # Reconnaissance des activités humaines à partir de données d'accélération dans des conditions naturelles

      L'objectif de ce projet était de développer un système de reconnaissance 
      d'activités humaines de bas niveau, telles que la marche, la course, 
      la position assise, etc., en utilisant un seul accéléromètre.

      En utilisant une méthode d'apprentissage supervisé, nous avons entraîné 
      un classifieur Random Forest à l'aide de vecteurs de caractéristiques 
      obtenus via notre modèle, qui nous a permis d'atteindre une précision de `95 %`.
      
