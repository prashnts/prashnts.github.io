    website: https://www.pmmh.espci.fr
    links:
      - title: Presentation
        url: /var/pmmh-poster.pdf
    description: |
      # Hydrodynamique des Super-Paramagnetic Micro-Beads

      Mon travail consistait à capturer le mouvement des micro-billes subissant
      une attraction due au champ magnétique externe. A partir de cela, il est
      possible de quantifier les forces hydrodynamiques agissant sur les micro-billes.

      En utilisant les outils open source `trackpy` et `scikit-image`, j'ai développé
      un pipeline de traitement d'images pour isoler, suivre et calculer les
      dynamiques du mouvement à partir des images. Nous avons atteint une cadence 
      moyenne de `~800` fps.

