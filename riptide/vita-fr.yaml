    description: |
      # Plotter à Stylo avec Changeur d’Outils

      Ce dispositif représente un système de traçage sophistiqué, dont l'architecture est
      quasi entièrement réalisable par impression additive (rapid prototyping).

      D'un point de vue fonctionnel, il intègre une gestion modulaire avancée des outils,
      permettant d'utiliser simultanément jusqu'à cinq modules ou stylos différents.
      Son élément technologique clé réside dans la calibration totalement automatisée
      des outils. Ce mécanisme simplifie le workflow opérationnel en garantissant une
      précision constante sans aucune intervention manuelle de l'utilisateur.

