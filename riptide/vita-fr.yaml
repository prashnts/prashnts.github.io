    website: http://www.msc.univ-paris-diderot.fr
    links:
      - title: Presentation
        url: /var/phylotaxis-presentation.pdf
    description: |
      # Étude de la diversité des motifs Phyllotactic

      La phyllotaxie est l'arrangement des organes latéraux chez les plantes. Dans ce
      projet, nous essayons d'expliquer l'origine des motifs émergents,
      des transitions et des irrégularités dans ces arrangements. En utilisant une
      projection cylindrique déroulante et déformante, j'ai développé un pipeline
      d'analyse d'image permettant une étude plus approfondie des organes végétaux complexes.

