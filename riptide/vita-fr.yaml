    description: |
      # Modélisation et analyse de réseau de la régulation de l'expression génique médiée par les miARN introniques

      Dans le cadre de ce projet, nous avons développé un modèle mathématique pour la 
      régulation de l'expression génique via les micro-ARN (miARN) introniques, basé 
      sur des données empiriques et des observations expérimentales réalisées à l'IGIB (Institute of Genomics and Integrative Biology).

      Dans le cadre de cette étude, nous avons également généré un réseau de cibles 
      `miARN <=> ARNm` en utilisant diverses bases de données disponibles.

